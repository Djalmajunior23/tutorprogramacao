services:
  traefik:
    image: traefik:v2.11
    container_name: portal-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
    networks:
      - portal-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: portal-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.portal-frontend.entrypoints=websecure"
      - "traefik.http.routers.portal-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.portal-frontend.loadbalancer.server.port=80"
    networks:
      - portal-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: portal-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
      PORT: 3001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal-backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.portal-backend.entrypoints=websecure"
      - "traefik.http.routers.portal-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.portal-backend.loadbalancer.server.port=3001"
    networks:
      - portal-net
    restart: unless-stopped

networks:
  portal-net:
    driver: bridge

volumes:
  traefik_letsencrypt:
